<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Adyen Drop-in (Card Only)</title>

    <!-- Adyen v5 CSS -->
    <link
        rel="stylesheet"
        href="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/5.52.0/adyen.css"
    />

    <!-- Adyen v5 JS -->
    <script
        src="https://checkoutshopper-test.adyen.com/checkoutshopper/sdk/5.52.0/adyen.js">
    </script>
</head>

<body>

<div id="dropin-container"></div>

<script th:inline="javascript">
    fetch("/api/sessions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            amount: 1000,
            currency: "PLN",
            countryCode: "PL",
            reference: "ORDER-123"
        })
    })
    .then(res => res.json())
    .then(session => {
        // Poprawnie wstawiony clientKey
        const clientKey = [[${clientKey}]]; 

        AdyenCheckout({
            environment: "test",
            clientKey: clientKey,
            session: session,
            paymentMethodsConfiguration: {
                card: {
                    hasHolderName: true,
                    holderNameRequired: true,
                    enableStoreDetails: false
                }
            }
        }).then(checkout => {
            checkout.create('dropin').mount("#dropin-container");
        });
    });
</script>

</body>
</html>
